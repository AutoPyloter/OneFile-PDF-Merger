<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneFile – PDF & Image Merger</title>
    <meta name="description"
        content="Merge PDFs and images into a single PDF file, all in your browser. No uploads, no server—100% private." />

    <!-- ─── Embedded Favicon (self-contained, no external file needed) ─── -->
    <link id="app-favicon" rel="icon" type="image/svg+xml" />
    <script>
        (function () {
            var svg = [
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">',
                '<defs>',
                '<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">',
                '<stop offset="0%" stop-color="#6c63ff"/>',
                '<stop offset="100%" stop-color="#a78bfa"/>',
                '</linearGradient>',
                '</defs>',
                '<rect width="32" height="32" rx="7" fill="url(#g)"/>',
                '<path d="M9 8h8l6 6v12a1 1 0 01-1 1H9a1 1 0 01-1-1V9a1 1 0 011-1z" fill="white" opacity=".96"/>',
                '<path d="M17 8l6 6h-6z" fill="white" opacity=".55"/>',
                '<rect x="11" y="15" width="10" height="1.5" rx=".75" fill="#6c63ff"/>',
                '<rect x="11" y="18" width="10" height="1.5" rx=".75" fill="#6c63ff"/>',
                '<rect x="11" y="21" width="6"  height="1.5" rx=".75" fill="#a78bfa"/>',
                '</svg>'
            ].join('');
            document.getElementById('app-favicon').href =
                'data:image/svg+xml;base64,' + btoa(svg);
        })();
    </script>

    <!-- ─── Tailwind CSS ─── -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ─── pdf-lib ─── -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <!-- ─── pdf.js ─── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- ─── SortableJS ─── -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <!-- ─── Google Fonts ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <style>
        /* ── Global Reset & Base ──────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #22263a;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #6c63ff;
            --accent2: #a78bfa;
            --danger: #f87171;
            --success: #34d399;
            --text: #e2e8f0;
            --muted: #64748b;
            --card-hover: rgba(108, 99, 255, 0.12);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Animated mesh background ─────────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(108, 99, 255, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(167, 139, 250, 0.12) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Scrollbar ────────────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface2);
            border-radius: 99px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ── Header / Navbar ──────────────────────────────────────────── */
        #app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 17, 23, 0.85);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: var(--text);
            flex-shrink: 0;
        }

        .logo span.accent {
            color: var(--accent2);
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-left: auto;
            flex-wrap: wrap;
        }

        /* ── Buttons ──────────────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-ghost:hover {
            background: var(--surface2);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.35);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 28px rgba(108, 99, 255, 0.55);
            filter: brightness(1.08);
        }

        .btn-danger {
            background: transparent;
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.12);
            border-color: var(--danger);
        }

        .btn-success {
            background: linear-gradient(135deg, #059669, #34d399);
            color: #fff;
            font-size: 0.95rem;
            padding: 0.7rem 1.6rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.3);
        }

        .btn-success:hover {
            box-shadow: 0 6px 28px rgba(52, 211, 153, 0.5);
            filter: brightness(1.08);
        }

        .btn-success:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: none;
            box-shadow: none;
        }

        /* View-toggle group */
        .toggle-group {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .toggle-btn {
            padding: 0.45rem 0.75rem;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .toggle-btn:hover {
            color: var(--text);
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #fff;
        }

        /* ── Sort button group ────────────────────────────────────────── */
        .sort-group {
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            gap: 0;
        }

        .btn-sort {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.42rem 0.7rem;
            background: transparent;
            border: none;
            border-right: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s;
            user-select: none;
        }

        .btn-sort:last-child {
            border-right: none;
        }

        .btn-sort:hover {
            background: var(--surface2);
            color: var(--text);
        }

        .btn-sort:active {
            opacity: 0.75;
        }

        .btn-sort:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ── Drop Zone ────────────────────────────────────────────────── */
        #drop-zone {
            border: 2px dashed rgba(108, 99, 255, 0.35);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            background: rgba(108, 99, 255, 0.04);
            position: relative;
        }

        #drop-zone:hover,
        #drop-zone.drag-over {
            border-color: var(--accent2);
            background: rgba(108, 99, 255, 0.1);
        }

        #drop-zone svg {
            opacity: 0.55;
        }

        /* ── Canvas / Grid ────────────────────────────────────────────── */
        #canvas-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        #file-canvas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        #file-canvas.list-view {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        /* ── File Card ────────────────────────────────────────────────── */
        .file-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: grab;
            position: relative;
        }

        .file-card:hover {
            border-color: rgba(108, 99, 255, 0.4);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .file-card.sortable-ghost {
            opacity: 0.4;
            border: 2px dashed var(--accent);
            background: var(--card-hover);
        }

        .file-card.sortable-chosen {
            box-shadow: 0 12px 40px rgba(108, 99, 255, 0.4);
            cursor: grabbing;
            transform: rotate(1.5deg) scale(1.02);
        }

        /* Thumbnail container */
        .card-thumb {
            width: 100%;
            aspect-ratio: 3/4;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-thumb img,
        .card-thumb canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .thumb-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Badge (page count) */
        .badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            color: var(--text);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 0.3px;
        }

        /* Card Info */
        .card-info {
            padding: 0.65rem 0.8rem 0.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .card-name {
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 0.68rem;
            color: var(--muted);
        }

        /* Card Controls */
        .card-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.4rem 0.6rem;
            border-top: 1px solid var(--border);
        }

        .ctrl-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.4rem;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.9rem;
            transition: all 0.18s;
        }

        .ctrl-btn:hover {
            background: var(--surface2);
            color: var(--text);
        }

        .ctrl-btn.remove:hover {
            background: rgba(248, 113, 113, 0.12);
            color: var(--danger);
        }

        /* ── List View Card Overrides ─────────────────────────────────── */
        .list-view .file-card {
            flex-direction: row;
            align-items: center;
            padding: 0.6rem;
            gap: 0.8rem;
            border-radius: 12px;
        }

        .list-view .card-thumb {
            width: 64px;
            height: 80px;
            aspect-ratio: unset;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .list-view .card-info {
            padding: 0;
            flex: 1;
        }

        .list-view .card-controls {
            border-top: none;
            padding: 0;
            flex-shrink: 0;
        }

        /* ── Drag handle ──────────────────────────────────────────────── */
        .drag-handle {
            position: absolute;
            top: 6px;
            left: 6px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.75rem;
            cursor: grab;
            z-index: 2;
            line-height: 1;
        }

        /* ── Empty State ──────────────────────────────────────────────── */
        #empty-state {
            grid-column: 1 / -1;
        }

        /* ── Sticky Merge Bar ─────────────────────────────────────────── */
        #merge-bar {
            position: sticky;
            bottom: 0;
            z-index: 40;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(15, 17, 23, 0.92);
            border-top: 1px solid var(--border);
        }

        .merge-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .file-count-label {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .file-count-label strong {
            color: var(--text);
        }

        /* ── Progress overlay ─────────────────────────────────────────── */
        #progress-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }

        #progress-overlay.show {
            display: flex;
        }

        .progress-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem 3rem;
            text-align: center;
            min-width: 320px;
        }

        .progress-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .progress-card p {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .progress-track {
            height: 6px;
            background: var(--surface2);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 99px;
            transition: width 0.25s ease;
            width: 0%;
        }

        /* ── Toast ────────────────────────────────────────────────────── */
        #toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.7rem 1.2rem;
            font-size: 0.82rem;
            color: var(--text);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 200;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #toast.success {
            border-color: rgba(52, 211, 153, 0.4);
            color: var(--success);
        }

        #toast.error {
            border-color: rgba(248, 113, 113, 0.4);
            color: var(--danger);
        }

        /* ── Animations ───────────────────────────────────────────────── */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-card {
            animation: fadeInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        /* ── Quality slider ───────────────────────────────────────────── */
        .quality-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.38rem 0.75rem;
            font-size: 0.75rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .quality-group label {
            font-weight: 600;
            color: var(--muted);
            user-select: none;
        }

        .quality-group #quality-val {
            min-width: 2.6rem;
            text-align: right;
            font-weight: 700;
            color: var(--accent2);
            font-size: 0.78rem;
        }

        input[type='range']#img-quality {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            width: 80px;
            border-radius: 99px;
            background: var(--surface2);
            outline: none;
            cursor: pointer;
        }

        input[type='range']#img-quality::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent2);
            cursor: pointer;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
            transition: box-shadow 0.15s;
        }

        input[type='range']#img-quality::-webkit-slider-thumb:hover {
            box-shadow: 0 0 0 5px rgba(167, 139, 250, 0.3);
        }

        /* ── Page-range input inside card ────────────────────────────── */
        .page-range-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.3rem;
        }

        .page-range-label {
            font-size: 0.63rem;
            font-weight: 600;
            color: var(--muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .page-range-input {
            flex: 1;
            min-width: 0;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.63rem;
            font-family: inherit;
            padding: 0.2rem 0.4rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .page-range-input::placeholder {
            color: var(--muted);
            opacity: 0.6;
        }

        .page-range-input:focus {
            border-color: var(--accent);
        }

        /* ── Page-number toggle in merge bar ─────────────────────────── */
        .pg-num-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .pg-num-toggle input[type='checkbox'] {
            display: none;
        }

        .toggle-pill {
            width: 34px;
            height: 18px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 99px;
            position: relative;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle-pill::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--muted);
            transition: transform 0.2s, background 0.2s;
        }

        .pg-num-toggle input:checked+.toggle-pill {
            background: var(--accent);
            border-color: var(--accent);
        }

        .pg-num-toggle input:checked+.toggle-pill::after {
            transform: translateX(16px);
            background: #fff;
        }

        /* ── Lang Toggle Button ───────────────────────────────────────── */
        .btn-lang {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.42rem 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.78rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            letter-spacing: 0.3px;
        }

        .btn-lang:hover {
            background: var(--surface2);
            border-color: var(--accent2);
            color: var(--accent2);
        }

        .btn-lang:active {
            transform: scale(0.95);
        }

        /* ── Responsive ───────────────────────────────────────────────── */
        @media (max-width: 640px) {
            #file-canvas {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .header-inner {
                padding: 0.7rem 1rem;
            }

            .progress-card {
                min-width: 90vw;
                padding: 2rem 1.5rem;
            }

            .quality-group {
                display: none;
            }

            /* hide on tiny screens */
        }

        /* ── Developer credit badge (inline, next to logo) ──────────── */
        .creator-badge {
            display: inline-flex;

    <!-- ════════════════════════════════════════════════════════════════

  ═════════════════════════════════════════════════════════════════ -->
    <script>
        'use strict';

        // ─── i18n Dictionary ──────────────────────────────────────────────
        const translations = {
            tr: {
                // Header Buttons
                addFiles: 'Dosya Ekle',
                clearAll: 'Temizle',
                sortDate: 'Tarih',
                sortReverse: 'Tersine',
                imageQuality: '🖼 Görüntü Kalitesi',
                // Drop Zone
                dropZoneTitle: 'PDF ve Resimleri Buraya Sürükleyin',
                dropZoneSub: 'veya araç çubuğundan <strong style="color:var(--accent2);">&quot;Dosya Ekle&quot;</strong> tıklayın &nbsp;·&nbsp; PDF, PNG, JPG, WEBP desteklenir',
                // Merge Bar
                fileCountSuffix: 'dosya',
                dragReorder: 'Sıralamak için sürükleyin',
                pageNumbers: 'Sayfa Numarası Ekle',
                mergeBtn: 'Birleştir ve Kaydet',
                // Progress
                progressTitle: 'Dokümanlar Birleştiriliyor\u2026',
                progressPreparing: 'Hazırlanıyor\u2026',
                progressCreating: 'Yeni belge oluşturuluyor\u2026',
                progressStamping: 'Sayfa numaraları damgalanıyor\u2026',
                progressSaving: 'PDF kaydediliyor\u2026',
                progressDone: 'Tamamlandı! ✓',
                // Card labels
                pagesLabel: 'Sayfalar:',
                pagesBadge: 'sf',
                // Page Range Input
                pageRangePlaceholder: 'Örn: 1, 3, 5-8',
                // Toasts & Alerts
                toastSaved: '✅ PDF başarıyla kaydedildi!',
                toastEncrypted: '🔒 Şifreli PDF atlandı',
                toastSortedAZ: '✦ A → Z Sıralandı',
                toastSortedNum: '✦ Sayısal Sıralandı',
                toastSortedDate: '✦ Tarihe Göre Sıralandı (en eskiden)',
                toastReversed: '✦ Sıra Tersine Çevrildi',
                toastSkipped: '⚠ Desteklenmeyen dosya atlandı',
                toastThumbError: '⚠ Önizleme oluşturulamadı',
                // Confirm dialog
                confirmClear: 'Tüm dosyalar listeden kaldırılsın mı?',
                // Lang toggle
                langToggle: '🇬🇧 EN',
            },
            en: {
                // Header Buttons
                addFiles: 'Add Files',
                clearAll: 'Clear',
                sortDate: 'Date',
                sortReverse: 'Reverse',
                imageQuality: '🖼 Image Quality',
                // Drop Zone
                dropZoneTitle: 'Drop PDFs & Images Here',
                dropZoneSub: 'or click <strong style="color:var(--accent2);">&quot;Add Files&quot;</strong> in the toolbar &nbsp;·&nbsp; Supports PDF, PNG, JPG, WEBP',
                // Merge Bar
                fileCountSuffix: 'file(s)',
                dragReorder: 'Drag to reorder',
                pageNumbers: 'Page Numbers',
                mergeBtn: 'Merge & Save',
                // Progress
                progressTitle: 'Merging Documents\u2026',
                progressPreparing: 'Preparing\u2026',
                progressCreating: 'Creating new document\u2026',
                progressStamping: 'Stamping page numbers\u2026',
                progressSaving: 'Saving PDF\u2026',
                progressDone: 'Done! ✓',
                // Card labels
                pagesLabel: 'Pages:',
                pagesBadge: 'pg',
                // Page Range Input
                pageRangePlaceholder: 'e.g. 1, 3, 5-8',
                // Toasts & Alerts
                toastSaved: '✅ PDF saved successfully!',
                toastEncrypted: '🔒 Skipped encrypted PDF',
                toastSortedAZ: '✦ Sorted A \u2192 Z',
                toastSortedNum: '✦ Sorted Numerically',
                toastSortedDate: '✦ Sorted by Date (oldest first)',
                toastReversed: '✦ Order reversed',
                toastSkipped: '⚠ Skipped unsupported file',
                toastThumbError: '⚠ Could not preview',
                // Confirm dialog
                confirmClear: 'Remove all files from the list?',
                // Lang toggle
                langToggle: '🇹🇷 TR',
            },
        };

        // ─── Active language state ─────────────────────────────────────────
        let currentLang = 'tr';

        /**
         * Apply translations for the given language to all data-i18n elements.
         * Also updates page lang attribute and page-range input placeholders.
         */
        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.documentElement.lang = lang;

            // Update all static data-i18n elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (key in t) el.innerHTML = t[key];
            });

            // Update page-range input placeholders dynamically
            document.querySelectorAll('.page-range-input').forEach(input => {
                input.placeholder = t.pageRangePlaceholder;
            });

            // Update the lang toggle button itself
            const btnLang = document.getElementById('btn-lang');
            if (btnLang) btnLang.textContent = t.langToggle;
        }

        /** Convenience: get a translated string for the current language */
        const tr = (key) => (translations[currentLang]?.[key] ?? key);

        // ─── Configure pdf.js worker ──────────────────────────────────────
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ─── State ────────────────────────────────────────────────────────
        /** @type {Array<{id:string, file:File, type:'pdf'|'image', rotation:number, pageCount:number|null, thumbUrl:string|null}>} */
        let fileItems = [];
        let viewMode = 'grid'; // 'grid' | 'list'
        let idCounter = 0;

        // ─── DOM refs ─────────────────────────────────────────────────────
        const fileInput = document.getElementById('file-input');
        const btnAddFiles = document.getElementById('btn-add-files');
        const btnClearAll = document.getElementById('btn-clear-all');
        const btnGridView = document.getElementById('btn-grid-view');
        const btnListView = document.getElementById('btn-list-view');
        const dropZone = document.getElementById('drop-zone');
        const fileCanvas = document.getElementById('file-canvas');
        const mergeBar = document.getElementById('merge-bar');
        const fileCountEl = document.getElementById('file-count');
        const btnMerge = document.getElementById('btn-merge');
        const progressOverlay = document.getElementById('progress-overlay');
        const progressFill = document.getElementById('progress-fill');
        const progressDetail = document.getElementById('progress-detail');
        const toast = document.getElementById('toast');

        // ─── SortableJS instance ──────────────────────────────────────────
        const sortable = new Sortable(fileCanvas, {
            animation: 180,
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            handle: '.drag-handle',
            onEnd(evt) {
                // Reorder the state array to match the new DOM order
                const newOrder = [...fileCanvas.querySelectorAll('.file-card')].map(el => el.dataset.id);
                fileItems.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
                updateFileCount();
            }
        });

        // ════════════════════════════════════════════════════════════════════
        //  UTILITY HELPERS
        // ════════════════════════════════════════════════════════════════════

        /** Generate a unique ID */
        const uid = () => `fi_${++idCounter}_${Date.now()}`;

        /** Format bytes → "1.23 MB" or "456 KB" */
        const fmtSize = (bytes) => {
            if (bytes >= 1_048_576) return (bytes / 1_048_576).toFixed(2) + ' MB';
            return (bytes / 1024).toFixed(1) + ' KB';
        };

        /** Show a brief toast notification */
        let toastTimer;
        const showToast = (msg, type = '') => {
            toast.textContent = msg;
            toast.className = `show ${type}`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
        };

        /** Set progress bar state */
        const setProgress = (pct, detail = '') => {
            progressFill.style.width = pct + '%';
            if (detail) progressDetail.textContent = detail;
        };

        /** Clamp rotation to 0-359 range */
        const clampRot = (deg) => ((deg % 360) + 360) % 360;

        // ════════════════════════════════════════════════════════════════════
        //  THUMBNAIL GENERATION
        // ════════════════════════════════════════════════════════════════════

        /**
         * Generate a thumbnail data-URL for the first page of a PDF using pdf.js.
         * @param {File} file
         * @returns {Promise<{dataUrl:string, pageCount:number}>}
         */
        async function pdfThumbnail(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const page = await pdf.getPage(1);

            const viewport = page.getViewport({ scale: 1 });
            // Scale so the longest side is ≤ 400px for a compact, sharp thumbnail
            const scale = Math.min(400 / viewport.width, 400 / viewport.height, 2);
            const scaledViewport = page.getViewport({ scale });

            const canvas = document.createElement('canvas');
            canvas.width = scaledViewport.width;
            canvas.height = scaledViewport.height;

            await page.render({
                canvasContext: canvas.getContext('2d'),
                viewport: scaledViewport,
            }).promise;

            return { dataUrl: canvas.toDataURL('image/png', 0.9), pageCount: pdf.numPages };
        }

        // ════════════════════════════════════════════════════════════════════
        //  FILE INGESTION
        // ════════════════════════════════════════════════════════════════════

        /** Accept a FileList/array, deduplicate by name+size, add to state & render */
        async function ingestFiles(rawFiles) {
            const files = Array.from(rawFiles);
            if (!files.length) return;

            for (const file of files) {
                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                const isImage = /^image\/(png|jpeg|jpg|webp)$/i.test(file.type);

                if (!isPdf && !isImage) {
                    showToast(`${tr('toastSkipped')}: ${file.name}`, 'error');
                    continue;
                }

                const item = {
                    id: uid(),
                    file,
                    type: isPdf ? 'pdf' : 'image',
                    rotation: 0,
                    pageCount: null,
                    thumbUrl: null,
                    pageRange: '',   // user-supplied page selection string (PDFs only)
                };

                fileItems.push(item);
                const card = createCard(item); // render a spinner while we generate the thumb
                fileCanvas.appendChild(card);

                // Generate thumbnail asynchronously
                try {
                    if (isPdf) {
                        const { dataUrl, pageCount } = await pdfThumbnail(file);
                        item.thumbUrl = dataUrl;
                        item.pageCount = pageCount;
                    } else {
                        item.thumbUrl = URL.createObjectURL(file);
                        item.pageCount = null;
                    }
                    updateCardThumb(item);
                } catch (err) {
                    console.error('Thumbnail error:', err);
                    showToast(`${tr('toastThumbError')}: ${file.name}`, 'error');
                    // Leave spinner; the file is still in state and will be merged
                }
            }

            updateUI();
        }

        // ════════════════════════════════════════════════════════════════════
        //  CARD RENDERING
        // ════════════════════════════════════════════════════════════════════

        /** Build and return a DOM card element for a file item */
        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.dataset.id = item.id;
            card.setAttribute('role', 'listitem');
            card.setAttribute('aria-label', item.file.name);

            // Build the page-range row only for PDFs
            const t = translations[currentLang];
            const pageRangeHtml = item.type === 'pdf' ? `
      <div class="page-range-row">
        <span class="page-range-label" data-i18n="pagesLabel">${t.pagesLabel}</span>
        <input
          type="text"
          class="page-range-input"
          id="pgrange-${item.id}"
          placeholder="${t.pageRangePlaceholder}"
          value="${escHtml(item.pageRange)}"
          aria-label="Page range for ${escHtml(item.file.name)}"
          autocomplete="off"
        />
      </div>` : '';

            card.innerHTML = `
      <span class="drag-handle" title="Drag to reorder">⠿⠿</span>

      <!-- Thumbnail -->
      <div class="card-thumb" id="thumb-${item.id}">
        <div class="thumb-spinner"></div>
      </div>

      <!-- Metadata -->
      <div class="card-info">
        <div class="card-name" title="${escHtml(item.file.name)}">${escHtml(item.file.name)}</div>
        <div class="card-meta">
          ${fmtSize(item.file.size)}
          ${item.type === 'pdf' ? ' &nbsp;·&nbsp; PDF' : ' &nbsp;·&nbsp; Image'}
        </div>
        ${pageRangeHtml}
      </div>

      <!-- Controls -->
      <div class="card-controls">
        <button class="ctrl-btn rotate-left"  title="Rotate left"  data-id="${item.id}" aria-label="Rotate left">↺</button>
        <button class="ctrl-btn rotate-right" title="Rotate right" data-id="${item.id}" aria-label="Rotate right">↻</button>
        <button class="ctrl-btn remove"       title="Remove"       data-id="${item.id}" aria-label="Remove file">✕</button>
      </div>
    `;

            // Control button listeners
            card.querySelector('.rotate-left').addEventListener('click', () => rotateItem(item.id, -90));
            card.querySelector('.rotate-right').addEventListener('click', () => rotateItem(item.id, +90));
            card.querySelector('.remove').addEventListener('click', () => removeItem(item.id));

            // Page-range input: update state & prevent drag from firing
            if (item.type === 'pdf') {
                const rangeInput = card.querySelector(`#pgrange-${item.id}`);
                if (rangeInput) {
                    // Stop mousedown/pointerdown from bubbling to SortableJS handle
                    rangeInput.addEventListener('mousedown', (e) => e.stopPropagation());
                    rangeInput.addEventListener('pointerdown', (e) => e.stopPropagation());
                    rangeInput.addEventListener('input', () => { item.pageRange = rangeInput.value.trim(); });
                }
            }

            return card;
        }

        /** Escape HTML to prevent XSS from file names */
        const escHtml = (str) =>
            str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        /** Update the thumbnail area of an already-rendered card */
        function updateCardThumb(item) {
            const thumbDiv = document.getElementById(`thumb-${item.id}`);
            if (!thumbDiv) return;

            // Determine badge text
            const badgeHtml = item.pageCount !== null
                ? `<span class="badge">${item.pageCount} ${tr('pagesBadge')}</span>`
                : '';

            thumbDiv.innerHTML = `
      <img
        src="${item.thumbUrl}"
        alt="${escHtml(item.file.name)} thumbnail"
        style="transform: rotate(${item.rotation}deg);"
        loading="lazy"
      />
      ${badgeHtml}
    `;
        }

        /** Apply CSS rotation to the thumbnail image inside a card */
        function applyRotationToCard(item) {
            const thumbDiv = document.getElementById(`thumb-${item.id}`);
            if (!thumbDiv) return;
            const img = thumbDiv.querySelector('img');
            if (img) img.style.transform = `rotate(${item.rotation}deg)`;
        }

        // ════════════════════════════════════════════════════════════════════
        //  STATE MUTATIONS
        // ════════════════════════════════════════════════════════════════════

        /** Rotate a file item's thumbnail by deltaDeg */
        function rotateItem(id, deltaDeg) {
            const item = fileItems.find(i => i.id === id);
            if (!item) return;
            item.rotation = clampRot(item.rotation + deltaDeg);
            applyRotationToCard(item);
        }

        /** Remove a file item from state and DOM */
        function removeItem(id) {
            const idx = fileItems.findIndex(i => i.id === id);
            if (idx === -1) return;

            // Revoke object URL to avoid memory leaks
            if (fileItems[idx].type === 'image' && fileItems[idx].thumbUrl) {
                URL.revokeObjectURL(fileItems[idx].thumbUrl);
            }

            fileItems.splice(idx, 1);
            document.querySelector(`.file-card[data-id="${id}"]`)?.remove();
            updateUI();
        }

        /** Update the file count label and visibility of the merge bar / drop zone */
        function updateUI() {
            const count = fileItems.length;
            fileCountEl.textContent = count;
            mergeBar.style.display = count > 0 ? 'block' : 'none';
            dropZone.style.display = count === 0 ? 'block' : 'none';
            btnMerge.disabled = count === 0;
            // Sort buttons require at least 2 items to be useful
            const canSort = count > 1;
            btnSortAZ.disabled = !canSort;
            btnSortNum.disabled = !canSort;
            btnSortDate.disabled = !canSort;
            btnSortReverse.disabled = !canSort;
        }

        const updateFileCount = () => {
            fileCountEl.textContent = fileItems.length;
        };

        // ════════════════════════════════════════════════════════════════════
        //  VIEW TOGGLE
        // ════════════════════════════════════════════════════════════════════

        function setView(mode) {
            viewMode = mode;
            if (mode === 'list') {
                fileCanvas.classList.add('list-view');
                btnListView.classList.add('active');
                btnGridView.classList.remove('active');
                btnListView.setAttribute('aria-pressed', 'true');
                btnGridView.setAttribute('aria-pressed', 'false');
            } else {
                fileCanvas.classList.remove('list-view');
                btnGridView.classList.add('active');
                btnListView.classList.remove('active');
                btnGridView.setAttribute('aria-pressed', 'true');
                btnListView.setAttribute('aria-pressed', 'false');
            }
        }

        // ════════════════════════════════════════════════════════════════════
        //  MERGE ENGINE
        // ════════════════════════════════════════════════════════════════════

        /**
         * Degrees of rotation → pdf-lib rotation constants.
         * pdf-lib uses PDFLib.degrees(n).
         */
        const toDegrees = (n) => PDFLib.degrees(n);

        /**
         * Main merge function.
         * Iterates state array in current order, embeds each file into a new PDFDocument.
         */
        async function mergeFiles() {
            if (fileItems.length === 0) return;

            // Show progress UI
            progressOverlay.classList.add('show');
            setProgress(0, tr('progressCreating'));
            btnMerge.disabled = true;

            try {
                const mergedPdf = await PDFLib.PDFDocument.create();
                const total = fileItems.length;

                for (let i = 0; i < total; i++) {
                    const item = fileItems[i];
                    const pct = Math.round(((i) / total) * 90);
                    setProgress(pct, `Processing (${i + 1}/${total}): ${item.file.name}`);

                    // ── Get compressed image buffer or raw PDF buffer ─────────
                    // For images, run through canvas-based JPEG compression at user quality
                    let arrayBuffer;
                    if (item.type === 'image') {
                        const quality = parseFloat(document.getElementById('img-quality').value);
                        arrayBuffer = await compressImage(item.file, quality);
                    } else {
                        arrayBuffer = await item.file.arrayBuffer();
                    }

                    if (item.type === 'pdf') {
                        // ── Embed PDF pages ──────────────────────────────────────
                        let srcDoc;
                        try {
                            srcDoc = await PDFLib.PDFDocument.load(arrayBuffer, {
                                ignoreEncryption: false,
                            });
                        } catch (err) {
                            if (err.message?.toLowerCase().includes('encrypt')) {
                                showToast(`${tr('toastEncrypted')}: ${item.file.name}`, 'error');
                                continue;
                            }
                            throw err;
                        }

                        // Resolve page selection: use parsePageRange or all pages
                        const indices = parsePageRange(item.pageRange, srcDoc.getPageCount());
                        const copiedPgs = await mergedPdf.copyPages(srcDoc, indices);

                        for (const page of copiedPgs) {
                            // Apply user rotation on top of any existing page rotation
                            if (item.rotation !== 0) {
                                const existing = page.getRotation().angle;
                                page.setRotation(toDegrees(clampRot(existing + item.rotation)));
                            }
                            mergedPdf.addPage(page);
                        }

                    } else {
                        // ── Embed image (already compressed via compressImage) ────
                        // compressImage always returns a JPEG buffer, so always embedJpg
                        const embeddedImage = await mergedPdf.embedJpg(arrayBuffer);

                        const { width, height } = embeddedImage;

                        // Add page using the image's natural dimensions (no axis-swapping needed).
                        // pdf-lib's page.setRotation() handles the visual rotation correctly,
                        // so the draw step is always flat at the origin.
                        const page = mergedPdf.addPage([width, height]);

                        // Draw the image completely flat — no rotate param here.
                        page.drawImage(embeddedImage, {
                            x: 0,
                            y: 0,
                            width,
                            height,
                        });

                        // Rotate the entire page object instead of the drawn image.
                        // This avoids the blank-page bug caused by pdf-lib's bottom-left origin
                        // pushing rotated pixels outside the visible canvas.
                        if (item.rotation !== 0) {
                            page.setRotation(toDegrees(clampRot(item.rotation)));
                        }
                    }
                }

                // ── Optional page numbering ─────────────────────────────────
                if (document.getElementById('chk-page-numbers').checked) {
                    setProgress(92, tr('progressStamping'));
                    const font = await mergedPdf.embedFont(PDFLib.StandardFonts.Helvetica);
                    const allPages = mergedPdf.getPages();
                    allPages.forEach((pg, idx) => {
                        const { width: pw } = pg.getSize();
                        const label = String(idx + 1);
                        const textW = font.widthOfTextAtSize(label, 11);
                        pg.drawText(label, {
                            x: pw / 2 - textW / 2,
                            y: 18,
                            size: 11,
                            font,
                            color: PDFLib.rgb(0.35, 0.35, 0.35),
                        });
                    });
                }

                setProgress(95, tr('progressSaving'));
                const pdfBytes = await mergedPdf.save();

                setProgress(100, tr('progressDone'));
                await savePdfBytes(pdfBytes, 'Merged_Document.pdf');

                showToast(tr('toastSaved'), 'success');

            } catch (err) {
                console.error('Merge error:', err);
                alert(`An error occurred during merge:\n${err.message}`);
            } finally {
                progressOverlay.classList.remove('show');
                btnMerge.disabled = false;
            }
        }

        /**
         * Convert a WEBP File to PNG ArrayBuffer using an off-screen canvas.
         * @param {File} file
         * @returns {Promise<ArrayBuffer>}
         */
        async function convertWebpToPng(file) {
            const url = URL.createObjectURL(file);
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    canvas.toBlob(async (blob) => {
                        URL.revokeObjectURL(url);
                        resolve(await blob.arrayBuffer());
                    }, 'image/png');
                };
                img.onerror = reject;
                img.src = url;
            });
        }

        // ════════════════════════════════════════════════════════════════════
        //  IMAGE COMPRESSION
        // ════════════════════════════════════════════════════════════════════

        /**
         * Compress any image File to a JPEG ArrayBuffer via an off-screen canvas.
         * Always outputs JPEG so pdf-lib can consistently use embedJpg.
         * @param {File} file
         * @param {number} quality  0.1 – 1.0
         * @returns {Promise<ArrayBuffer>}
         */
        async function compressImage(file, quality) {
            const url = URL.createObjectURL(file);
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    canvas.toBlob(async (blob) => {
                        URL.revokeObjectURL(url);
                        if (!blob) { reject(new Error('compressImage: toBlob returned null')); return; }
                        resolve(await blob.arrayBuffer());
                    }, 'image/jpeg', quality);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`Could not load image: ${file.name}`)); };
                img.src = url;
            });
        }

        // ════════════════════════════════════════════════════════════════════
        //  PAGE RANGE PARSER
        // ════════════════════════════════════════════════════════════════════

        /**
         * Parse a page range string like "1, 3, 5-8" into a sorted array of
         * zero-based page indices valid for pdf-lib's copyPages().
         * Returns all indices when the string is empty or entirely invalid.
         * @param {string} rangeStr
         * @param {number} totalPages
         * @returns {number[]}
         */
        function parsePageRange(rangeStr, totalPages) {
            const allIndices = Array.from({ length: totalPages }, (_, i) => i);
            if (!rangeStr || !rangeStr.trim()) return allIndices;

            const indices = new Set();
            const parts = rangeStr.split(',');

            for (const part of parts) {
                const trimmed = part.trim();
                if (!trimmed) continue;

                const rangeMatch = trimmed.match(/^(\d+)-(\d+)$/);
                const singleMatch = trimmed.match(/^(\d+)$/);

                if (rangeMatch) {
                    const start = parseInt(rangeMatch[1], 10);
                    const end = parseInt(rangeMatch[2], 10);
                    for (let p = start; p <= end; p++) {
                        const zb = p - 1; // convert to zero-based
                        if (zb >= 0 && zb < totalPages) indices.add(zb);
                    }
                } else if (singleMatch) {
                    const zb = parseInt(singleMatch[1], 10) - 1;
                    if (zb >= 0 && zb < totalPages) indices.add(zb);
                }
                // silently ignore malformed tokens
            }

            // Fall back to all pages if nothing valid was parsed
            if (indices.size === 0) return allIndices;
            return [...indices].sort((a, b) => a - b);
        }

        // ════════════════════════════════════════════════════════════════════
        //  SAVE / EXPORT
        // ════════════════════════════════════════════════════════════════════

        /**
         * Save the PDF bytes to disk.
         * Prefers the modern File System Access API; falls back to <a download>.
         * @param {Uint8Array} bytes
         * @param {string} defaultName
         */
        async function savePdfBytes(bytes, defaultName) {
            const blob = new Blob([bytes], { type: 'application/pdf' });

            // ── Modern: showSaveFilePicker ────────────────────────────────
            if (typeof window.showSaveFilePicker === 'function') {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: defaultName,
                        types: [{
                            description: 'PDF Document',
                            accept: { 'application/pdf': ['.pdf'] },
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return; // success
                } catch (err) {
                    // User cancelled (AbortError) or API failed → fall through to fallback
                    if (err.name === 'AbortError') return;
                    console.warn('showSaveFilePicker failed, using fallback:', err);
                }
            }

            // ── Fallback: <a download> ─────────────────────────────────────
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = defaultName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            // Revoke after a brief delay to ensure download starts
            setTimeout(() => URL.revokeObjectURL(url), 10_000);
        }

        // ════════════════════════════════════════════════════════════════════
        //  SORTING
        // ════════════════════════════════════════════════════════════════════

        // DOM refs for sort buttons
        const btnSortAZ = document.getElementById('btn-sort-az');
        const btnSortNum = document.getElementById('btn-sort-num');
        const btnSortDate = document.getElementById('btn-sort-date');
        const btnSortReverse = document.getElementById('btn-sort-reverse');

        /**
         * After mutating the `fileItems` array, reorder the existing card DOM nodes
         * inside #file-canvas by calling appendChild() on each (moves, not clones).
         * This preserves thumbnails, spinners, and all event listeners.
         */
        function applyDOMOrder() {
            for (const item of fileItems) {
                const card = fileCanvas.querySelector(`.file-card[data-id="${item.id}"]`);
                if (card) fileCanvas.appendChild(card); // move to end → natural reorder
            }
        }

        /** Sort A-Z by filename using locale-aware comparison */
        function sortAZ() {
            fileItems.sort((a, b) => a.file.name.localeCompare(b.file.name));
            applyDOMOrder();
            showToast(tr('toastSortedAZ'), 'success');
        }

        /** Sort Numerically by filename */
        function sortNum() {
            fileItems.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, { numeric: true, sensitivity: 'base' }));
            applyDOMOrder();
            showToast(tr('toastSortedNum'), 'success');
        }

        /** Sort by lastModified date, oldest first */
        function sortByDate() {
            fileItems.sort((a, b) => a.file.lastModified - b.file.lastModified);
            applyDOMOrder();
            showToast(tr('toastSortedDate'), 'success');
        }

        /** Reverse the current order */
        function reverseOrder() {
            fileItems.reverse();
            applyDOMOrder();
            showToast(tr('toastReversed'), 'success');
        }

        // ════════════════════════════════════════════════════════════════════
        //  EVENT LISTENERS
        // ════════════════════════════════════════════════════════════════════

        // Add Files button → triggers hidden file input
        btnAddFiles.addEventListener('click', () => fileInput.click());

        // File input → ingest selected files
        fileInput.addEventListener('change', (e) => {
            ingestFiles(e.target.files);
            fileInput.value = ''; // reset so the same file can be re-added
        });

        // Clear all
        btnClearAll.addEventListener('click', () => {
            if (fileItems.length === 0) return;
            if (!confirm(tr('confirmClear'))) return;
            // Revoke all object URLs
            fileItems.forEach(item => {
                if (item.type === 'image' && item.thumbUrl) URL.revokeObjectURL(item.thumbUrl);
            });
            fileItems = [];
            fileCanvas.innerHTML = '';
            updateUI();
        });

        // View toggle
        btnGridView.addEventListener('click', () => setView('grid'));
        btnListView.addEventListener('click', () => setView('list'));

        // Merge button
        btnMerge.addEventListener('click', mergeFiles);

        // Sort buttons
        btnSortAZ.addEventListener('click', sortAZ);
        btnSortNum.addEventListener('click', sortNum);
        btnSortDate.addEventListener('click', sortByDate);
        btnSortReverse.addEventListener('click', reverseOrder);

        // ── Drag & Drop onto the canvas area ─────────────────────────────
        const preventDefaults = (e) => { e.preventDefault(); e.stopPropagation(); };

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt =>
            document.addEventListener(evt, preventDefaults, false)
        );

        // Highlight drop zone
        document.addEventListener('dragover', () => dropZone.classList.add('drag-over'));
        document.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        document.addEventListener('drop', (e) => {
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer?.files?.length) {
                ingestFiles(e.dataTransfer.files);
            }
        });

        // Click the drop zone itself
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') fileInput.click();
        });

        // Quality slider live-update
        const imgQualitySlider = document.getElementById('img-quality');
        const qualityValEl = document.getElementById('quality-val');
        imgQualitySlider.addEventListener('input', () => {
            qualityValEl.textContent = Math.round(parseFloat(imgQualitySlider.value) * 100) + '%';
        });

        // ── Language toggle button ─────────────────────────────────────────
        document.getElementById('btn-lang').addEventListener('click', () => {
            setLanguage(currentLang === 'tr' ? 'en' : 'tr');
        });

        // Initial UI state & language (TR is default)
        setLanguage('tr');
        updateUI();

    </script>

</body>

</html>
